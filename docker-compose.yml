services:
  ziwei:
    build:
      context: ./app
      dockerfile: Dockerfile
    image: ziwei-selfhost:1.0.0
    container_name: ziwei
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-28763}:3000"
    env_file:
      - .env
    environment:
      INTERP_DB: /data/interp.db
      NODE_ENV: production
    volumes:
      # 解读库只读挂载；容器内不存任何用户数据
      - ./data:/data:ro
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
